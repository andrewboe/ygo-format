[project]
name = "ygo-format"
version = "0.1.0"
description = "Format-aware Yu-Gi-Oh! card data and an MCP server for deckbuilding (TCG Advanced, Genesys)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ygo-format-mcp = "ygoformat.mcp_server:main"

[project.urls]
Homepage = "https://github.com/andrewboe/ygo-format"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ygoformat"]
